name: Build ArAr Shot Release APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK 35, NDK and CMake
        run: |
          echo "y" | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true
          echo "y" | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;26.1.10909125" || true
          sudo chown -R $USER:$USER ${ANDROID_HOME} || true

      - name: Setup NCNN Android Vulkan SDK
        run: |
          chmod +x setup_ncnn.sh
          ./setup_ncnn.sh

      - name: Verify Bundled NCNN Assets
        run: |
          mkdir -p app/src/main/assets/models
          ls -lh app/src/main/assets/models/

      - name: Ensure Signing Keystore
        run: |
          if [ -f "release.keystore" ]; then
            echo "Using tracked permanent release keystore."
          else
            keytool -genkeypair -v -keystore release.keystore -alias ararshot -keyalg RSA -keysize 2048 -validity 10000 -storepass ararshotpassword -keypass ararshotpassword -dname "CN=ArAr Shot, OU=Mobile, O=GudangJoker, L=Jakarta, ST=DKI, C=ID"
          fi

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Signed APK (Release & Debug)
        run: ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Prepare Named Release APKs
        run: |
          mkdir -p release_assets
          find app/build/outputs/apk -type f -name "*.apk" -ls

          for f in app/build/outputs/apk/release/*.apk; do
            if [ -f "$f" ]; then
              cp -v "$f" "release_assets/ArAr-Shot-v3.1.0.apk"
              cp -v "$f" "release_assets/ArAr-Shot-v3.1.0-release.apk"
              break
            fi
          done

          for f in app/build/outputs/apk/debug/*.apk; do
            if [ -f "$f" ]; then
              cp -v "$f" "release_assets/ArAr-Shot-v3.1.0-debug.apk"
              break
            fi
          done

          ls -lh release_assets/

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArArShot-v3.1.0-Release-APK
          path: release_assets/ArAr-Shot-v3.1.0*.apk
          if-no-files-found: error

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArArShot-v3.1.0-Debug-APK
          path: release_assets/ArAr-Shot-v3.1.0-debug.apk
          if-no-files-found: warn

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v3.1.0' }}
          name: "ArAr Shot v3.1.0"
          body_path: RELEASE_NOTES.md
          make_latest: true
          files: release_assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
