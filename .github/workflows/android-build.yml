name: Build ArAr Shot APK (Personal Release)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Personal APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup NCNN Android Vulkan SDK
        run: |
          chmod +x setup_ncnn.sh
          ./setup_ncnn.sh

      - name: Verify Real-ESRGAN Model Assets
        run: |
          mkdir -p app/src/main/assets/models
          if [ ! -f "app/src/main/assets/models/realesr-general-x4v3.param" ] || [ ! -f "app/src/main/assets/models/realesr-general-x4v3.bin" ]; then
            echo "Downloading Real-ESRGAN model assets..."
            curl -L -o "app/src/main/assets/models/realesr-general-x4v3.param" "https://github.com/TransparentLC/realesrgan-gui/releases/download/additional-models/realesr-general-x4v3.param"
            curl -L -o "app/src/main/assets/models/realesr-general-x4v3.bin" "https://github.com/TransparentLC/realesrgan-gui/releases/download/additional-models/realesr-general-x4v3.bin"
          fi
          ls -la app/src/main/assets/models/

      - name: Ensure Signing Keystore
        run: |
          if [ ! -f "release.keystore" ]; then
            echo "Generating personal release keystore..."
            keytool -genkeypair -v -keystore release.keystore -alias ararshot -keyalg RSA -keysize 2048 -validity 10000 -storepass ararshotpassword -keypass ararshotpassword -dname "CN=ArArShot, OU=Personal, O=ArAr, L=Jakarta, ST=Jakarta, C=ID"
          fi

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Signed APK (Release & Debug)
        run: ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArArShot-Personal-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArArShot-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "ArAr Shot v1.0.0 (Personal Offline Release)"
          body_path: RELEASE_NOTES.md
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
