name: Build ArAr Shot APK (Personal Release)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Personal APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android NDK and CMake
        run: |
          echo "y" | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true
          echo "y" | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "cmake;3.22.1" "ndk;26.1.10909125" || true
          sudo chown -R $USER:$USER ${ANDROID_HOME} || true

      - name: Setup NCNN Android Vulkan SDK
        run: |
          chmod +x setup_ncnn.sh
          ./setup_ncnn.sh

      - name: Verify Real-ESRGAN Model Assets
        run: |
          mkdir -p app/src/main/assets/models
          if [ ! -f "app/src/main/assets/models/realesr-general-x4v3.param" ] || [ ! -f "app/src/main/assets/models/realesr-general-x4v3.bin" ]; then
            echo "Downloading Real-ESRGAN model assets..."
            curl -L -o "app/src/main/assets/models/realesr-general-x4v3.param" "https://github.com/TransparentLC/realesrgan-gui/releases/download/additional-models/realesr-general-x4v3.param"
            curl -L -o "app/src/main/assets/models/realesr-general-x4v3.bin" "https://github.com/TransparentLC/realesrgan-gui/releases/download/additional-models/realesr-general-x4v3.bin"
          fi
          ls -la app/src/main/assets/models/

      - name: Ensure Signing Keystore
        run: |
          if [ ! -f "release.keystore" ]; then
            echo "Generating personal release keystore..."
            keytool -genkeypair -v -keystore release.keystore -alias ararshot -keyalg RSA -keysize 2048 -validity 10000 -storepass ararshotpassword -keypass ararshotpassword -dname "CN=ArArShot, OU=Personal, O=ArAr, L=Jakarta, ST=Jakarta, C=ID"
          fi

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Signed APK (Release & Debug)
        run: ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Prepare Named Release APKs
        run: |
          mkdir -p release_assets
          echo "=== Locating built APKs ==="
          find app/build/outputs/apk -type f -name "*.apk" -ls
          
          # Copy release APK
          for f in app/build/outputs/apk/release/*.apk; do
            if [ -f "$f" ]; then
              cp -v "$f" "release_assets/ArAr-Shot-v.1.0.2.apk"
              cp -v "$f" "release_assets/ArAr-Shot-v.1.0.2-release.apk"
              break
            fi
          done
          
          # Copy debug APK
          for f in app/build/outputs/apk/debug/*.apk; do
            if [ -f "$f" ]; then
              cp -v "$f" "release_assets/ArAr-Shot-v.1.0.2-debug.apk"
              break
            fi
          done
          
          # Verify release APK was copied
          if [ ! -f "release_assets/ArAr-Shot-v.1.0.2.apk" ]; then
            echo "ERROR: release_assets/ArAr-Shot-v.1.0.2.apk not found!"
            exit 1
          fi
          
          ls -lh release_assets/

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArArShot-v1.0.2-Personal-Release-APK
          path: release_assets/ArAr-Shot-v.1.0.2*.apk
          if-no-files-found: error

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArArShot-v1.0.2-Debug-APK
          path: release_assets/ArAr-Shot-v.1.0.2-debug.apk
          if-no-files-found: warn

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.2' }}
          name: "ArAr Shot v.1.0.2 (Personal Offline Release)"
          body_path: RELEASE_NOTES.md
          make_latest: true
          files: release_assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
